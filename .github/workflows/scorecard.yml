name: Scorecard

# OpenSSF Scorecard supply-chain analysis, published to api.scorecard.dev (for
# a badge) and uploaded to code scanning. Runs on prod pushes, branch
# protection changes, weekly and on demand. Shaped by the scorecard-action
# "Workflow Restrictions": no top-level env/defaults, no workflow-level write
# permissions, id-token only on the analysis job, whose steps may only use
# checkout, upload-artifact, codeql upload-sarif and scorecard-action.

on:
  push:
    branches: [prod]
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: '57 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard only accepts the default branch outside pull requests (a
    # dispatch from another branch would fail with "only default branch").
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # CI-Tests / SAST checks read workflow runs
      checks: read # CI-Tests check reads check runs
      issues: read # Maintained check reads issue activity
      pull-requests: read # Code-Review check reads merged PRs
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token proves the published result came from this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard

  # The analysis job may not run shell steps, so the human-readable score
  # table comes from the result it just published. Report only: the public
  # API can lag a publish, so this job never fails the workflow.
  summary:
    name: Score summary
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Write score summary
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://api.scorecard.dev/projects/github.com/${REPO}"
          json="$RUNNER_TEMP/scorecard.json"
          curl -fsSL --retry 3 --retry-delay 10 "$url" -o "$json"
          {
            echo "### OpenSSF Scorecard: $(jq -r '.score' "$json") / 10"
            echo
            echo "Commit \`$(jq -r '.repo.commit[0:7]' "$json")\`, scored $(jq -r '.date' "$json"). Viewer: https://scorecard.dev/viewer/?uri=github.com/${REPO}"
            echo
            echo '| Check | Score | Reason |'
            echo '| --- | ---: | --- |'
            # Weakest checks first; inconclusive (-1) ones last.
            jq -r '.checks | sort_by(if .score < 0 then 11 else .score end) | .[] |
              "| [\(.name)](\(.documentation.url)) | \(if .score < 0 then "n/a" else .score end) | \(.reason | gsub("\\|"; "\\|")) |"' "$json"
          } >> "$GITHUB_STEP_SUMMARY"
