name: opencode payload

# The on-device opencode payload (liboc-engine.so + liboc-opentui.so, ~200 MB, not
# in git; docs/bootstrap/). patch-check proves our patches and pins still fit
# the pinned upstream tags; upstream-drift tries the newest opencode tag (early
# warning); build-payload cross-builds the payload with scripts/agents/oc and
# uploads `oc-payload-arm64`. Runs on payload-build changes, weekly, on demand.

on:
  push:
    branches: [prod]
    paths:
      - scripts/agents/oc/**
      - docs/bootstrap/**
      - app/src/engine/agents/oc/web.ts
      - .github/workflows/oc-payload.yml
      - .github/ci/oc-payload/**
  pull_request:
    paths:
      - scripts/agents/oc/**
      - docs/bootstrap/**
      - app/src/engine/agents/oc/web.ts
      - .github/workflows/oc-payload.yml
      - .github/ci/oc-payload/**
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      build-payload:
        description: Also build the payload (~30-60 min). Off = patch-check and drift only.
        type: boolean
        default: true

permissions:
  contents: read

# Every push runs to completion (one group per commit); only a newer commit on
# the same PR cancels the older PR run. A force-push's replaced commit is
# cancelled by cancel-replaced.yml. Scheduled and manual runs get own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The pins. A bump edits these together with the driver defaults
# (scripts/agents/oc/build.sh) and docs/bootstrap; patch-check's
# pins table names whichever was missed. BUN_VERSION, OPENTUI_VERSION and
# ANDROID_API also reach the driver as env, so CI builds exactly these.
env:
  OPENCODE_TAG: v2.0.26    # anomalyco/opencode, pair-era API
  OPENTUI_VERSION: 0.5.17  # anomalyco/opentui; = the tag's @opentui/core catalog pin
  BUN_VERSION: 1.4.2       # = the tag's packageManager
  ZIG_VERSION: 0.16.0      # = opentui build.zig SUPPORTED_ZIG_VERSIONS
  NDK_VERSION: r28c
  ANDROID_API: '29'

# Explicit bash runs steps with -eo pipefail (the unset default is plain
# `bash -e`), so a `check.sh | tee -a "$GITHUB_STEP_SUMMARY"` step fails when
# the check does.
defaults:
  run:
    shell: bash

jobs:
  patch-check:
    name: patch-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pins agree (oc-payload.yml, driver defaults, docs)
        run: bash .github/ci/oc-payload/pins.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clone upstream at the pinned tags
        id: clone
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$OPENCODE_TAG" \
            https://github.com/anomalyco/opencode.git "$RUNNER_TEMP/opencode"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$OPENTUI_VERSION" \
            https://github.com/anomalyco/opentui.git "$RUNNER_TEMP/opentui"

      - name: Upstream contract (patches, pins, anchor, pair API, theme)
        if: ${{ !cancelled() && steps.clone.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            echo "### Upstream contract: opencode \`$OPENCODE_TAG\`, opentui \`v$OPENTUI_VERSION\`"
            echo
            bash .github/ci/oc-payload/upstream.sh check strict "$RUNNER_TEMP/opencode" "$RUNNER_TEMP/opentui"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  upstream-drift:
    name: upstream-drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Early warning, not a gate: the newest upstream tag breaking our patches
    # is news for the next bump; the pinned build is unaffected.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Newest upstream opencode tag
        id: tag
        run: |
          set -euo pipefail
          latest="$(bash .github/ci/oc-payload/upstream.sh latest-tag https://github.com/anomalyco/opencode.git)"
          if [ -z "$latest" ]; then
            echo "::error::no vX.Y.Z tags found on anomalyco/opencode"
            exit 1
          fi
          same=false
          if [ "$latest" = "$OPENCODE_TAG" ]; then same=true; fi
          {
            echo "tag=$latest"
            echo "same=$same"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream drift"
            echo
            echo "Pinned \`$OPENCODE_TAG\`; newest upstream tag \`$latest\`."
            echo
            if [ "$same" = true ]; then echo "The pin is the newest tag; patch-check covers it."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clone the newest tag and the opentui it pins
        id: clone
        if: steps.tag.outputs.same != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$TAG" \
            https://github.com/anomalyco/opencode.git "$RUNNER_TEMP/opencode"
          pin="$(bash .github/ci/oc-payload/upstream.sh opentui-pin "$RUNNER_TEMP/opencode")"
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::unexpected @opentui/core pin in $TAG: $pin"
            exit 1
          fi
          echo "opentui=$pin" >> "$GITHUB_OUTPUT"
          if ! git -c advice.detachedHead=false clone -q --depth 1 --branch "v$pin" \
               https://github.com/anomalyco/opentui.git "$RUNNER_TEMP/opentui"; then
            echo "\`$TAG\` pins @opentui/core \`$pin\`, but anomalyco/opentui has no \`v$pin\` tag." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upstream contract at the newest tag (report)
        if: steps.tag.outputs.same != 'true' && steps.clone.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PIN: ${{ steps.clone.outputs.opentui }}
        run: |
          set -euo pipefail
          {
            echo "#### opencode \`$TAG\`, opentui \`v$PIN\`"
            echo
            echo "DRIFT rows are pins a bump to this tag would move; FAIL rows need work first."
            echo
            bash .github/ci/oc-payload/upstream.sh check report "$RUNNER_TEMP/opencode" "$RUNNER_TEMP/opentui"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  changes:
    name: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - name: Did this push touch the build inputs?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Build inputs: the payload scripts/patches plus this workflow and
          # its helpers. Docs or the web adapter alone only need patch-check.
          build=true
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "New branch, nothing to diff against: building."
          elif files="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[]?.filename')"; then
            n="$(grep -c . <<<"$files" || true)"
            # The compare API lists at most 300 files; past that, assume a hit.
            if [ "$n" -lt 300 ] \
               && ! grep -qE '^(scripts/agents/oc/|\.github/workflows/oc-payload\.yml$|\.github/ci/oc-payload/)' <<<"$files"; then
              build=false
            fi
          else
            echo "::warning::compare $BEFORE...$AFTER failed; building to be safe"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Payload build for this push: **$build**" >> "$GITHUB_STEP_SUMMARY"

  build-payload:
    name: build-payload
    needs: [patch-check, changes]
    if: >-
      ${{ !cancelled() && needs.patch-check.result == 'success' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.build-payload) ||
        (github.event_name == 'push' && needs.changes.outputs.build == 'true')
      ) }}
    # linux-x86_64 host: the driver and the opentui build.zig patch both
    # hardcode the NDK's prebuilt/linux-x86_64 toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk, pick workdir
        id: runner
        run: bash .github/ci/oc-payload/prepare-runner.sh 20 | tee -a "$GITHUB_STEP_SUMMARY"

      # Not cached: the ~700 MB zip comes from dl.google.com about as fast as a
      # cache restore would, and would crowd the repo's shared 10 GB cache.
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      # Its global-cache save also covers the renderer (opentui) build.
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: opentui-${{ env.OPENTUI_VERSION }}
          cache-size-limit: 1024

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check toolchain
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: bash .github/ci/oc-payload/check-toolchain.sh "$NDK_ROOT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight Bun cross-compile runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Upstream build.ts lists bun-v$BUN_VERSION's assets through the
          # GitHub API WITHOUT a token, then downloads this zip. Fail now if the
          # release lacks it; warn if this runner's anonymous API quota is low
          # (a 403 there would only surface late in the build).
          asset=bun-linux-aarch64-android.zip
          names="$(gh api "repos/oven-sh/bun/releases/tags/bun-v$BUN_VERSION" --jq '.assets[].name')"
          if ! grep -qxF "$asset" <<<"$names"; then
            echo "::error::bun-v$BUN_VERSION has no $asset; build.ts cannot cross-compile for android"
            exit 1
          fi
          left="$(curl -fsS https://api.github.com/rate_limit | jq -r '.resources.core.remaining' || echo '?')"
          echo "bun-v$BUN_VERSION ships $asset; anonymous GitHub API calls left here: $left"
          if [[ "$left" =~ ^[0-9]+$ ]] && [ "$left" -lt 5 ]; then
            echo "::warning::only $left anonymous GitHub API calls left; build.ts's Bun release lookup may get a 403"
          fi

      - name: Clone upstream at the pinned tags
        env:
          WORK: ${{ steps.runner.outputs.dir }}
        run: |
          set -euo pipefail
          oc="$WORK/oc-v2"                      # driver default OPENCODE_WORKTREE
          ot="$WORK/opentui-$OPENTUI_VERSION"   # driver default OPENTUI_SRC
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$OPENCODE_TAG" \
            https://github.com/anomalyco/opencode.git "$oc"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$OPENTUI_VERSION" \
            https://github.com/anomalyco/opentui.git "$ot"
          # Fresh trees, so both patches must apply. The driver reads a failed
          # `apply --check` as "already applied" and carries on, which here
          # would only surface much later as a confusing build error.
          git -C "$oc" apply --check "$GITHUB_WORKSPACE/scripts/agents/oc/patches/build-android-target.patch"
          git -C "$ot" apply --check "$GITHUB_WORKSPACE/scripts/agents/oc/patches/opentui-android-build.patch"
          oc_sha="$(git -C "$oc" rev-parse HEAD)"
          ot_sha="$(git -C "$ot" rev-parse HEAD)"
          {
            echo "### Sources"
            echo
            echo "| Tree | Ref | Commit |"
            echo "|---|---|---|"
            echo "| anomalyco/opencode | \`$OPENCODE_TAG\` | \`$oc_sha\` |"
            echo "| anomalyco/opentui | \`v$OPENTUI_VERSION\` | \`$ot_sha\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (scripts/agents/oc/build.sh)
        id: build
        env:
          WORK: ${{ steps.runner.outputs.dir }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          HUSKY: '0'  # upstream's root `prepare` runs husky on install; nothing to hook here
        run: |
          set -euo pipefail
          ZIG_BIN="$(command -v zig)"
          export ZIG_BIN
          # Bun's install cache on the workdir's disk, as on a dev box: bun then
          # hardlinks node_modules from it (the layout the driver's in-place
          # @opentui/core edit, step 3.5, is proven with) and the disk is not
          # spent twice. Deliberately not cached across runs: that in-place
          # edit lands in the hardlinked cache copy too.
          export BUN_INSTALL_CACHE_DIR="$WORK/bun-install-cache"
          start=$SECONDS
          bash scripts/agents/oc/build.sh "$WORK"
          echo "minutes=$(( (SECONDS - start + 59) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Stage (scripts/agents/oc/stage.sh, linkage guard)
        env:
          WORK: ${{ steps.runner.outputs.dir }}
        run: bash scripts/agents/oc/stage.sh "$WORK/out" "$RUNNER_TEMP/libs/arm64-v8a"

      - name: ELF identity and SHA256SUMS
        run: bash .github/ci/oc-payload/verify-payload.sh sums "$RUNNER_TEMP/libs/arm64-v8a" | tee -a "$GITHUB_STEP_SUMMARY"

      # Consumers (android.yml) fetch it by this exact name. The zip drops the
      # exec bit; AGP packages jniLibs regardless.
      - name: Upload oc-payload-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-payload-arm64
          path: |
            ${{ runner.temp }}/libs/arm64-v8a/liboc-engine.so
            ${{ runner.temp }}/libs/arm64-v8a/liboc-opentui.so
            ${{ runner.temp }}/libs/arm64-v8a/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      # After the upload on purpose: a payload that fails here is still there
      # to download and inspect. The job (and run) still fails.
      - name: Static checks (INTERP, NEEDED, markers, symbol scan)
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bash .github/ci/oc-payload/verify-payload.sh deep "$RUNNER_TEMP/libs/arm64-v8a" \
            "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot" "$ANDROID_API" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build stats
        if: ${{ !cancelled() && steps.runner.outputs.dir != '' }}
        env:
          WORK: ${{ steps.runner.outputs.dir }}
          MINUTES: ${{ steps.build.outputs.minutes }}
        run: |
          df -h / "$WORK"
          free -h
          {
            echo "### Build stats"
            echo
            echo "- Driver run: ${MINUTES:-n/a} min"
            echo "- Free on the workdir disk after: $(df -h --output=avail "$WORK" | tail -n1 | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  payload-contract:
    name: payload-contract
    needs: build-payload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download oc-payload-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oc-payload-arm64
          path: payload

      - name: Layout and checksums a consumer relies on
        working-directory: payload
        run: |
          set -euo pipefail
          ls -la
          want=$'SHA256SUMS\nliboc-engine.so\nliboc-opentui.so'
          got="$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::artifact layout changed; consumers expect exactly: ${want//$'\n'/, }"
            exit 1
          fi
          result="$(sha256sum -c SHA256SUMS)"
          {
            echo "### oc-payload-arm64 round trip"
            echo
            echo '```'
            echo "$result"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
