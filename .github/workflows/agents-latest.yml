name: Agents latest

# Every image agent kind at its newest release: what we rely on in it still
# there (agents/AGENTS.md → Image kinds, Probes). No sign-in, no model, no
# secret.
#   plan    the harness's tests (a fake ACP agent among them) and the image
#           kinds (agents/kit/cli/list.mjs --type image)
#   tools   kit-cli (render-install, render-launch)
#   legs    .github/ci/agents-latest/leg.mjs per kind: installed into a fresh
#           arm64 machine (the local-model check's Dockerfile) as the phone
#           installs it, its config seeded and its launch env set as the
#           runner does, then its probes (agents/image/<id>/probes.json):
#           help output that still names our flags, runs that still take
#           our config, and its ACP mode's answer to the runner's
#           initialize. A kind with no probes is installed and
#           version-checked only. A failure names the kind, the probe and
#           what is missing.
# The kinds install their newest upstream release, so the weekly run catches
# an update that drops a flag, a config key or an ACP capability before a
# phone does. Runs on changes to what the legs run, weekly (Mondays, before
# local-models.yml's run), on demand.

on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/agents-latest.yml'
      - '.github/ci/agents-latest/**'
      # The machine: the local-model check's.
      - '.github/ci/local-models/Dockerfile'
      # The kinds: manifests, the config the runner seeds, probes.
      - 'agents/image/*/agent.json'
      - 'agents/image/*/probes.json'
      - 'agents/image/*/config/**'
      - 'agents/shared/**'
      - 'agents/kit/scripts/**'
      - 'agents/runtimes/**'
      # list.mjs and its manifest loader and validators (the harness imports them).
      - 'agents/kit/cli/**'
      - 'agents/kit/ts/manifest/**'
      # kit-cli and the kit-render code it runs (the agents/ Gradle build).
      - 'agents/kit/kotlin/api/**'
      - 'agents/kit/kotlin/manifest/**'
      - 'agents/kit/kotlin/render/**'
      - 'agents/kit/kotlin/cli/**'
      - 'agents/kit/schema/fixtures/**'
      - 'agents/*.kts'
      - 'agents/gradle.properties'
      - 'agents/gradle/**'
      - 'agents/gradlew'
  pull_request:
    paths:
      - '.github/workflows/agents-latest.yml'
      - '.github/ci/agents-latest/**'
      # The machine: the local-model check's.
      - '.github/ci/local-models/Dockerfile'
      # The kinds: manifests, the config the runner seeds, probes.
      - 'agents/image/*/agent.json'
      - 'agents/image/*/probes.json'
      - 'agents/image/*/config/**'
      - 'agents/shared/**'
      - 'agents/kit/scripts/**'
      - 'agents/runtimes/**'
      # list.mjs and its manifest loader and validators (the harness imports them).
      - 'agents/kit/cli/**'
      - 'agents/kit/ts/manifest/**'
      # kit-cli and the kit-render code it runs (the agents/ Gradle build).
      - 'agents/kit/kotlin/api/**'
      - 'agents/kit/kotlin/manifest/**'
      - 'agents/kit/kotlin/render/**'
      - 'agents/kit/kotlin/cli/**'
      - 'agents/kit/schema/fixtures/**'
      - 'agents/*.kts'
      - 'agents/gradle.properties'
      - 'agents/gradle/**'
      - 'agents/gradlew'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# Every push runs to completion (one group per commit); only a newer commit on
# the same PR cancels the older PR run. A force-push's replaced commit is
# cancelled by cancel-replaced.yml. Scheduled and manual runs get own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit bash runs steps with -eo pipefail, so a `leg.mjs | tee` step fails
# when the leg does.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kinds: ${{ steps.plan.outputs.kinds }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci/agents-latest
            agents

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Harness tests (node --test)
        run: node --test ".github/ci/agents-latest/**/*.test.mjs"

      - name: Image kinds (agents/kit/cli/list.mjs --type image)
        id: plan
        run: |
          kinds="$(node agents/kit/cli/list.mjs --type image --matrix | jq -c '.include')"
          count="$(jq 'length' <<<"$kinds")"
          {
            echo "kinds=$kinds"
            echo "count=$count"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Image kinds: $count"
            echo
            jq -r '.[] | "- `\(.id)`"' <<<"$kinds"
          } >>"$GITHUB_STEP_SUMMARY"

  tools:
    name: tools (kit-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: agents

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: kit-cli (test, installDist)
        working-directory: agents
        run: ./gradlew :kit-cli:test :kit-cli:installDist --console=plain

      # Every leg takes it by this exact name; a tarball keeps the exec bits.
      - name: Pack kit-cli
        run: tar -czf "$RUNNER_TEMP/agents-latest-tools.tar.gz" -C agents/kit/kotlin/cli/build/install kit-cli

      - name: Upload kit-cli
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-latest-tools
          path: ${{ runner.temp }}/agents-latest-tools.tar.gz
          retention-days: 7
          if-no-files-found: error

  legs:
    name: leg (${{ matrix.id }})
    needs: [plan, tools]
    if: needs.plan.outputs.count != '0'
    # arm64, as the phone: a kind's install fetches the build a phone gets
    # (Crush's names its arm64 tarball), and the machine's base images are
    # multi-arch.
    runs-on: ubuntu-24.04-arm
    # An install (up to its manifest's timeout), then each probe (up to
    # PROBE_TIMEOUT) and the ACP handshake (up to ACP_TIMEOUT).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.kinds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci/agents-latest
            .github/ci/local-models
            agents

      # leg.mjs imports the kit's TS validators (type stripping, Node 22.18+).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # kit-cli's start script needs a JVM.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Download kit-cli
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents-latest-tools
          path: ${{ runner.temp }}/dl

      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          tar -xzf "$RUNNER_TEMP/dl/agents-latest-tools.tar.gz" -C "$RUNNER_TEMP/tools"

      - name: Machine (.github/ci/local-models/Dockerfile)
        run: docker build -q -t phonecando-agents-latest .github/ci/local-models

      - name: Leg (.github/ci/agents-latest/leg.mjs)
        env:
          KIND: ${{ matrix.id }}
          MACHINE: phonecando-agents-latest
        run: node .github/ci/agents-latest/leg.mjs "$KIND" "$RUNNER_TEMP/tools/kit-cli" "$RUNNER_TEMP/leg" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results and install log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-latest-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/leg/results.jsonl
            ${{ runner.temp }}/leg/install.log
          retention-days: 14
          if-no-files-found: warn

  agents-latest-ok:
    # Green only when every job above succeeded (a skipped or cancelled job
    # counts as a failure; the legs may skip only when there is no image kind).
    name: agents-latest-ok
    if: always()
    needs: [plan, tools, legs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every agents-latest job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r --arg count "$COUNT" '[to_entries[]
            | select(.value.result != "success")
            | select((.key == "legs" and .value.result == "skipped" and $count == "0") | not)
            | .key] | join(", ")')
          if [[ -n "$failed" ]]; then
            echo "::error title=agents-latest-ok::not green: $failed"
            exit 1
          fi
