name: Android

# Builds the app from a clean checkout the way the release scripts do: Expo
# prebuild (app/android is CNG output), debug APKs per channel, a release-shape
# lite + full build signed with a throwaway key, lint, and an emulator smoke
# test. Runs on prod pushes, pull requests, nightly (drift) and on demand.

on:
  push:
    branches: [prod]
    # Only what goes into the APK; the nightly run builds everything anyway.
    # Order matters: the .md exclusion comes after the includes, and the
    # packaged agent configs (which have an AGENTS.md) are re-included last.
    paths:
      - 'app/**'
      # Pulled into the app's Gradle build (app/android/settings.gradle includeBuild).
      - 'pce/**'
      # Compiled into the APK by app/modules/phonecando-linux (CMake), and
      # the Linux runtime modules it includes (app/plugins/withLreCompositeBuild.js).
      # proot's stage script checks the staged artifact in the release job;
      # the image lock names the Default image the release job stages.
      - 'lre/launcher/**'
      - 'lre/proot/stage.sh'
      - 'lre/images/default/lock.json'
      - 'lre/images/default/lock/**'
      - 'lre/api/**'
      - 'lre/tar/**'
      - 'lre/oci/**'
      - 'lre/image/**'
      - 'lre/cli/build.gradle.kts'
      - 'lre/*.kts'
      - 'lre/gradle.properties'
      - 'lre/gradle/**'
      # Local models: the lme modules phonecando-models and the runner include
      # (app/plugins/withLmeCompositeBuild.js) and the payload's stage script.
      - 'lme/api/**'
      - 'lme/gguf/**'
      - 'lme/catalog/**'
      - 'lme/store/**'
      - 'lme/host/**'
      - 'lme/*.kts'
      - 'lme/gradle.properties'
      - 'lme/gradle/**'
      - 'lme/llamacpp/stage.sh'
      # Bundled into the app by its telemetry adapter (app/src/engine/telemetry/).
      - 'tce/client/**'
      - 'tce/core/**'
      # App colours and icons (app/tamagui.config.ts, app/src/globals/theme.ts).
      - 'theme/**'
      # The About page's barcode encoder, shared with the site (app/src/ui/settings/Barcode.tsx).
      - 'web/src/lib/code128.ts'
      - '.github/workflows/android.yml'
      - '.github/ci/android/**'
      # Agent kinds: the Kotlin the runner builds against (included by
      # app/plugins/withAgentsCompositeBuild.js), the kit TS the app
      # bundles, and the manifest loader and payload staging the audit and
      # the release job run.
      - 'agents/kit/kotlin/**'
      - 'agents/builtin/**'
      - 'agents/*/*/kotlin/**'
      - 'agents/*.kts'
      - 'agents/gradle.properties'
      - 'agents/gradle/**'
      - 'agents/kit/ts/**'
      - 'agents/kit/cli/manifests.mjs'
      - 'agents/kit/native/**'
      - '.github/ci/agent-payload/stage-artifacts.mjs'
      - '!**/*.md'
      - '!app/docs/**'
      # Packaged into the APK and audited byte for byte: each kind's
      # manifest and config, and the shared parts the configs pull in.
      - 'agents/*/*/agent.json'
      - 'agents/*/*/config/**'
      - 'agents/*/*/config-lite/**'
      - 'agents/shared/**'
      # Also packaged (agents.gradle): the runtime plugins and the kit
      # scripts an engine start seeds into an agent's home.
      - 'agents/runtimes/*/runtime.json'
      - 'agents/runtimes/*/install/**'
      - 'agents/kit/scripts/phonecando-event'
      - 'agents/kit/scripts/phonecando-open'
  pull_request:
    # Only what goes into the APK; the nightly run builds everything anyway.
    # Order matters: the .md exclusion comes after the includes, and the
    # packaged agent configs (which have an AGENTS.md) are re-included last.
    paths:
      - 'app/**'
      # Pulled into the app's Gradle build (app/android/settings.gradle includeBuild).
      - 'pce/**'
      # Compiled into the APK by app/modules/phonecando-linux (CMake), and
      # the Linux runtime modules it includes (app/plugins/withLreCompositeBuild.js).
      # proot's stage script checks the staged artifact in the release job;
      # the image lock names the Default image the release job stages.
      - 'lre/launcher/**'
      - 'lre/proot/stage.sh'
      - 'lre/images/default/lock.json'
      - 'lre/images/default/lock/**'
      - 'lre/api/**'
      - 'lre/tar/**'
      - 'lre/oci/**'
      - 'lre/image/**'
      - 'lre/cli/build.gradle.kts'
      - 'lre/*.kts'
      - 'lre/gradle.properties'
      - 'lre/gradle/**'
      # Local models: the lme modules phonecando-models and the runner include
      # (app/plugins/withLmeCompositeBuild.js) and the payload's stage script.
      - 'lme/api/**'
      - 'lme/gguf/**'
      - 'lme/catalog/**'
      - 'lme/store/**'
      - 'lme/host/**'
      - 'lme/*.kts'
      - 'lme/gradle.properties'
      - 'lme/gradle/**'
      - 'lme/llamacpp/stage.sh'
      # Bundled into the app by its telemetry adapter (app/src/engine/telemetry/).
      - 'tce/client/**'
      - 'tce/core/**'
      # App colours and icons (app/tamagui.config.ts, app/src/globals/theme.ts).
      - 'theme/**'
      # The About page's barcode encoder, shared with the site (app/src/ui/settings/Barcode.tsx).
      - 'web/src/lib/code128.ts'
      - '.github/workflows/android.yml'
      - '.github/ci/android/**'
      # Agent kinds: the Kotlin the runner builds against (included by
      # app/plugins/withAgentsCompositeBuild.js), the kit TS the app
      # bundles, and the manifest loader and payload staging the audit and
      # the release job run.
      - 'agents/kit/kotlin/**'
      - 'agents/builtin/**'
      - 'agents/*/*/kotlin/**'
      - 'agents/*.kts'
      - 'agents/gradle.properties'
      - 'agents/gradle/**'
      - 'agents/kit/ts/**'
      - 'agents/kit/cli/manifests.mjs'
      - 'agents/kit/native/**'
      - '.github/ci/agent-payload/stage-artifacts.mjs'
      - '!**/*.md'
      - '!app/docs/**'
      # Packaged into the APK and audited byte for byte: each kind's
      # manifest and config, and the shared parts the configs pull in.
      - 'agents/*/*/agent.json'
      - 'agents/*/*/config/**'
      - 'agents/*/*/config-lite/**'
      - 'agents/shared/**'
      # Also packaged (agents.gradle): the runtime plugins and the kit
      # scripts an engine start seeds into an agent's home.
      - 'agents/runtimes/*/runtime.json'
      - 'agents/runtimes/*/install/**'
      - 'agents/kit/scripts/phonecando-event'
      - 'agents/kit/scripts/phonecando-open'
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      agent_payload_run_id:
        description: >-
          Optional run id of an agent-payload.yml run: its
          <prefix>-payload-arm64 artifacts (oc-payload-arm64 for opencode)
          are packaged into the release-shape build and the audit's payload
          gate is enforced for each one staged.
        required: false
        default: ''
        type: string
      proot_run_id:
        description: >-
          Optional run id of a proot.yml run: its proot-android-arm64
          artifact is staged into the release-shape build (lre/proot/stage.sh
          checks it against its SHA256SUMS) and the audit's proot gate is
          enforced.
        required: false
        default: ''
        type: string
      llamacpp_run_id:
        description: >-
          Optional run id of a llamacpp.yml run: its llamacpp-android-arm64
          artifact (libllama-server.so, for local models) is staged into the
          release-shape build (lme/llamacpp/stage.sh checks its SHA256SUMS).
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Every push runs to completion (one group per commit); only a newer commit on
# the same PR cancels the older PR run. A force-push's replaced commit is
# cancelled by cancel-replaced.yml. Scheduled and manual runs get own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_GIT_STATUS: '1'

defaults:
  run:
    shell: bash

jobs:
  # The PTY's plain POSIX core (app/modules/phonecando-terminal/android/src/
  # main/cpp/pty) on the host: spawn, env, fds, signals, reaping, kill and
  # resize, with close_range and with the fallback close loop.
  pty-host-test:
    name: PTY core host test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run the PTY core test
        run: sh app/modules/phonecando-terminal/android/src/test/c/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

  prebuild:
    name: Prebuild (config plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Generate app/android and check every plugin's output
        run: bash .github/ci/android/prebuild.sh
      - name: Second prebuild is byte-identical
        # app/plugins/gradleBlock.js promises repeated prebuilds are
        # byte-identical; Expo's own template mods are outside this repo, so
        # this reports until it has been seen green, then can gate.
        continue-on-error: true
        run: bash .github/ci/android/prebuild.sh --again
      - name: Upload generated app/android
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-prebuild-output
          path: app/android
          retention-days: 7
          if-no-files-found: warn

  assemble:
    name: Debug APK (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: [lite, full, play]
    env:
      CHANNEL: ${{ matrix.channel }}
      # The phone's ABI; the emulator runs the release-shape build instead.
      ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: bash .github/ci/android/free-disk.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # 21 runs Gradle; the PCE (full's included build) asks for a 17 toolchain.
          java-version: |
            17
            21
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Generate app/android (expo prebuild)
        run: bash .github/ci/android/prebuild.sh
      - name: NDK, CMake and Gradle sizing
        run: bash .github/ci/android/toolchain.sh
      - name: Assemble ${{ matrix.channel }}Debug
        id: build
        working-directory: app/android
        run: ./gradlew ":app:assemble${CHANNEL^}Debug" -PreactNativeArchitectures="$ABIS" --stacktrace --console=plain
      # The engine host (agents, supervisor, bridge, redaction) and the Linux
      # host (records, jobs, terminal recipes, play refusals) on the JVM, per
      # channel: full adds the phone-control routes, play the Linux refusals.
      - name: JVM tests (runner + linux, ${{ matrix.channel }})
        working-directory: app/android
        run: >-
          ./gradlew ":phonecando-runner:test${CHANNEL^}DebugUnitTest"
          ":phonecando-linux:test${CHANNEL^}DebugUnitTest" --stacktrace --console=plain
      - name: Audit APK
        run: >-
          node .github/ci/android/audit-apk.mjs
          --apk "app/android/app/build/outputs/apk/$CHANNEL/debug/app-$CHANNEL-debug.apk"
          --channel "$CHANNEL" --build debug --abis "$ABIS"
          --json "$RUNNER_TEMP/out/audit.json"
      - name: Stage APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./app/app.json').expo.version")
          mkdir -p "$RUNNER_TEMP/out"
          cp "app/android/app/build/outputs/apk/$CHANNEL/debug/app-$CHANNEL-debug.apk" \
            "$RUNNER_TEMP/out/phonecando-$ver-$CHANNEL-debug-arm64.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum ./*.apk >SHA256SUMS)
      - name: Upload APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.channel }}-debug
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release shape (lite + full, throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      # Only for the optional agent payloads from another run (workflow_dispatch).
      actions: read
    env:
      # Releases are arm64 only; x86_64 is added so the emulator job can run
      # these exact APKs. The audit checks the ABI list either way.
      ABIS: arm64-v8a,x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: bash .github/ci/android/free-disk.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Generate app/android (expo prebuild)
        run: bash .github/ci/android/prebuild.sh
      - name: NDK, CMake and Gradle sizing
        run: bash .github/ci/android/toolchain.sh
      - name: Fetch agent payloads (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_payload_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-payload-arm64'
          run-id: ${{ inputs.agent_payload_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agent-payloads
      - name: Stage agent payloads
        id: payloads
        env:
          PAYLOADS_DIR: ${{ runner.temp }}/agent-payloads
        # Not in the repository (agents/native/<id>/build/ builds them);
        # without one the build is complete except for that kind's engine,
        # and the audit skips its gate. Writes payloads={channel: {id: mode}}.
        run: node .github/ci/agent-payload/stage-artifacts.mjs "$PAYLOADS_DIR" lite full
      - name: Fetch proot (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.proot_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proot-android-arm64
          run-id: ${{ inputs.proot_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/proot
      - name: Stage proot
        id: proot
        env:
          PROOT_DIR: ${{ runner.temp }}/proot
        run: |
          set -euo pipefail
          # Not in the repository (lre/proot builds it); without it full and
          # lite carry the launcher but no proot, and the audit skips that gate.
          mode=optional
          if [ -f "$PROOT_DIR/libproot.so" ] && [ -f "$PROOT_DIR/libproot-loader.so" ]; then
            bash lre/proot/stage.sh "$PROOT_DIR"
            mode=required
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "proot: **$([ "$mode" = required ] && echo staged || echo 'not staged (not in the repository)')**" >>"$GITHUB_STEP_SUMMARY"
      - name: Fetch llama-server (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llamacpp_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llamacpp-android-arm64
          run-id: ${{ inputs.llamacpp_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/llamacpp
      - name: Stage llama-server
        env:
          LLAMACPP_DIR: ${{ runner.temp }}/llamacpp
        run: |
          set -euo pipefail
          # Not in the repository (lme/llamacpp builds it); without it the
          # app builds and local models say the server is missing.
          if [ -f "$LLAMACPP_DIR/libllama-server.so" ]; then
            bash lme/llamacpp/stage.sh "$LLAMACPP_DIR"
            echo "llama-server: **staged**" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "llama-server: **not staged (not in the repository)**" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage the locked Default image
        id: image
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          set -euo pipefail
          # lre/images/default/lock.json names the image the APK ships; all
          # nulls means nothing is locked yet (exit 3): build without it.
          rc=0
          bash lre/images/default/lock/check.sh --locked || rc=$?
          mode=optional
          if [ "$rc" -eq 0 ]; then
            bash lre/images/default/lock/fetch.sh "$IMAGES"
            bash lre/images/default/lock/stage.sh "$IMAGES"
            mode=required
          elif [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Default image: **$([ "$mode" = required ] && echo 'staged from the lock' || echo 'not staged (nothing locked yet)')**" >>"$GITHUB_STEP_SUMMARY"
      - name: Generate a throwaway release key
        id: key
        run: |
          set -euo pipefail
          # withReleaseSigning.js refuses a release build without
          # PHONECANDO_STORE_FILE. This key lives only in this job: the APKs
          # it signs can never update the published app.
          umask 077
          ks="$RUNNER_TEMP/phonecando-ci-throwaway.p12"
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -noprompt -keystore "$ks" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias phonecando \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=PhoneCanDo CI throwaway (not the release key), O=PhoneCanDo CI"
          keytool -exportcert -alias phonecando -keystore "$ks" -storetype PKCS12 \
            -storepass "$pw" -file "$RUNNER_TEMP/ci-cert.der"
          # Same shape as the private release.env the release scripts source.
          printf '%s\n' "PHONECANDO_STORE_FILE=$ks" "PHONECANDO_STORE_PASSWORD=$pw" \
            "PHONECANDO_KEY_ALIAS=phonecando" "PHONECANDO_KEY_PASSWORD=$pw" >"$RUNNER_TEMP/release-signing.env"
          echo "cert_sha256=$(sha256sum "$RUNNER_TEMP/ci-cert.der" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - name: Assemble fullRelease + liteRelease (one Gradle run, like release-android.mjs)
        id: build
        working-directory: app/android
        env:
          PHONECANDO_RELEASE_ENV: ${{ runner.temp }}/release-signing.env
        run: |
          set -euo pipefail
          set -a
          # shellcheck source=/dev/null
          source "$PHONECANDO_RELEASE_ENV"
          set +a
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease \
            -PreactNativeArchitectures="$ABIS" --stacktrace --console=plain
      - name: Audit both APKs (release gate + CI checks)
        env:
          CERT_SHA256: ${{ steps.key.outputs.cert_sha256 }}
          PAYLOADS: ${{ steps.payloads.outputs.payloads }}
          PROOT: ${{ steps.proot.outputs.mode }}
          IMAGE: ${{ steps.image.outputs.mode }}
        run: |
          set -uo pipefail
          status=0
          for ch in lite full; do
            node .github/ci/android/audit-apk.mjs \
              --apk "app/android/app/build/outputs/apk/$ch/release/app-$ch-release.apk" \
              --channel "$ch" --build release --abis "$ABIS" \
              --cert-sha256 "$CERT_SHA256" --payloads "$(jq -c --arg ch "$ch" '.[$ch] // {}' <<<"$PAYLOADS")" \
              --proot "$PROOT" --image "$IMAGE" \
              --json "$RUNNER_TEMP/out/$ch/audit.json" || status=1
          done
          exit "$status"
      - name: Stage APKs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./app/app.json').expo.version")
          for ch in lite full; do
            dir="$RUNNER_TEMP/out/$ch"
            mkdir -p "$dir"
            cp "app/android/app/build/outputs/apk/$ch/release/app-$ch-release.apk" \
              "$dir/phonecando-$ver-$ch-ci-throwaway-signed.apk"
            printf '%s\n' \
              "NOT A RELEASE. UNSIGNED FOR RELEASE PURPOSES." \
              "Release build type of the $ch channel from $COMMIT ($RUN_URL)," \
              "signed with a throwaway key generated inside that CI job and discarded." \
              "Android refuses it as an update to the published app (different signer)." \
              "ABIs: $ABIS (published releases are arm64-v8a only)." \
              "Each native agent's engine (opencode's included) is in it only if audit.json says it was staged." \
              >"$dir/NOT-A-RELEASE.txt"
            (cd "$dir" && sha256sum ./*.apk >SHA256SUMS)
          done
      - name: Upload lite APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-lite-release-shape-throwaway-signed
          path: ${{ runner.temp }}/out/lite/
          retention-days: 7
          if-no-files-found: error
      - name: Upload full APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-full-release-shape-throwaway-signed
          path: ${{ runner.temp }}/out/full/
          retention-days: 7
          if-no-files-found: error

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Reporting job: findings go to the summary, PR annotations and the
    # artifact. Non-blocking until it has run green once (first run may hit
    # lint-only configuration issues no build exercises).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: bash .github/ci/android/free-disk.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Generate app/android (expo prebuild)
        run: bash .github/ci/android/prebuild.sh
      - name: NDK, CMake and Gradle sizing
        run: bash .github/ci/android/toolchain.sh
      # Not :app: its lint analyses every node_modules Android library and
      # crashes inside react-native-worklets (a lint bug, not ours). :app is
      # Expo's generated template; our native code is in these two modules.
      - name: Lint runner (full + lite) and terminal
        working-directory: app/android
        env:
          INIT_SCRIPT: ${{ github.workspace }}/.github/ci/android/lint.init.gradle
        run: >-
          ./gradlew --init-script "$INIT_SCRIPT"
          :phonecando-runner:lintFullDebug :phonecando-runner:lintLiteDebug
          :phonecando-terminal:lintDebug
          --continue --stacktrace --console=plain
      - name: Summarise lint findings
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          node .github/ci/android/lint-summary.mjs \
            app/android/app/build/reports/lint-results-*.xml \
            app/modules/*/android/build/reports/lint-results-*.xml
      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-reports
          path: |
            app/android/app/build/reports/lint-results-*
            app/modules/*/android/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: warn

  emulator:
    name: Emulator smoke (${{ matrix.channel }}, API ${{ matrix.api }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # lite on the target API gates. full and the minSdk leg report until they
    # have been seen green on hosted emulators.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: lite, api: 36, experimental: false }
          - { channel: full, api: 36, experimental: true }
          - { channel: lite, api: 29, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release-shape APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ matrix.channel }}-release-shape-throwaway-signed
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run the smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_DIR: ${{ runner.temp }}/apk
          SMOKE_OUT: ${{ runner.temp }}/smoke
          CHANNEL: ${{ matrix.channel }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-animations: true
          # The action runs each script line through sh; keep it one line.
          script: bash .github/ci/android/smoke.sh "$APK_DIR" "$SMOKE_OUT" "$CHANNEL"
      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke-${{ matrix.channel }}-api${{ matrix.api }}
          path: ${{ runner.temp }}/smoke/
          retention-days: 7
          if-no-files-found: warn
