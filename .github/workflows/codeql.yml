name: CodeQL

# CodeQL code scanning (advanced setup) for every language in the repo:
# JS/TS (app, web, scripts), the workflows themselves, the PCE Kotlin build
# (pce/, really compiled) and the JNI PTY in C (forkpty.c, compiled with the
# host gcc). Runs on prod pushes, every PR and weekly to pick up new queries.
# Repo setting: code scanning "default setup" must be OFF for this to upload.

on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

# Every push runs to completion (one group per commit); only a newer commit on
# the same PR cancels the older PR run. A force-push's replaced commit is
# cancelled by cancel-replaced.yml. Scheduled and manual runs get own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # lets the CodeQL action read workflow run metadata
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Kotlin has no build-mode none (Kotlin files are skipped without a
          # build), so the PCE is compiled under the CodeQL tracer. The app's
          # own Kotlin (app/modules/*/android) needs a full Expo prebuild plus
          # the RN Gradle build and is not traced here; android.yml builds it.
          - language: java-kotlin
            build-mode: manual
          # forkpty.c only needs <jni.h> and libc's <pty.h>, so it compiles
          # standalone with gcc; a real compile beats build-mode none's guesses.
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 17 is the PCE toolchain (jvmToolchain(17)); 21 runs Gradle and is
      # left on JAVA_HOME. The C build also takes <jni.h> from JAVA_HOME.
      - name: Set up JDK 17 + 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          # Vendored minified xterm.js and the generated page that inlines it
          # are upstream code, not ours to fix. paths-ignore only affects the
          # interpreted (build-mode none) languages.
          config: |
            paths-ignore:
              - app/assets/xterm/xterm.js
              - app/assets/xterm/terminal.bundle.html
              - '**/node_modules'
              - '**/dist'

      # --no-daemon/--no-build-cache: CodeQL only sees compilations that run in
      # this traced process tree, so nothing may be reused from a daemon or a
      # cache. The Kotlin compiler runs in-process for the same reason.
      - name: Build PCE (traced)
        if: matrix.language == 'java-kotlin'
        working-directory: pce
        run: >-
          ./gradlew --no-daemon --no-build-cache --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          assemble

      - name: Build JNI sources (traced)
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/jni-objs"
          mkdir -p "$out"
          mapfile -t sources < <(find app/modules -path '*/android/src/main/cpp/*' -name '*.c' | sort)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::no JNI C sources found under app/modules/*/android/src/main/cpp"
            exit 1
          fi
          for src in "${sources[@]}"; do
            echo "gcc -c $src"
            gcc -std=gnu17 -Wall -Wextra -fPIC -c \
              -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
              "$src" -o "$out/$(basename "$src" .c).o"
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
