# Gitleaks config for the `gitleaks` job in .github/workflows/security.yml.
# Starts from gitleaks' built-in rules and only adds path allowlists for
# third-party or generated files whose minified code trips the generic-api-key
# rule (e.g. `t.TwoKeyMap=void` in xterm.js), and for redaction tests whose
# inputs are made-up keys (limited to the rules they trip). Keep this list
# short: every entry here is a file nobody will ever see a secret finding for.
# Path entries, not inline `gitleaks:allow`, because the job scans full history.

title = "PhoneCanDo gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Vendored upstream xterm.js build, and the generated terminal page that inlines it as base64 (its own sources, terminal.js/terminal.html, stay scanned)"
paths = [
  '''(?:^|/)app/assets/xterm/xterm\.js$''',
  '''(?:^|/)app/assets/xterm/terminal\.bundle\.html$''',
]

[[allowlists]]
description = "Made-up keys the redaction tests (telemetry, guest logs) feed in to check they come out as <secret>; only the rules they trip, so a real token of another kind in these files still fails"
targetRules = ["generic-api-key", "curl-auth-header", "gcp-api-key"]
paths = [
  '''(?:^|/)app/modules/phonecando-runner/android/src/test/java/com/phonecando/runner/PathRedactorTest\.kt$''',
  '''(?:^|/)app/modules/phonecando-linux/android/src/test/java/com/phonecando/linux/guest/LogRedactorTest\.kt$''',
  '''(?:^|/)tce/core/redact\.test\.ts$''',
]

[[allowlists]]
description = "The made-up model-server key kit-cli's render-model tests use to check the key never reaches the output"
targetRules = ["generic-api-key"]
paths = [
  '''(?:^|/)agents/kit/kotlin/cli/src/test/kotlin/com/phonecando/agents/kit/cli/RenderModelTest\.kt$''',
]
