// Gradle init script for the android.yml lint job (passed with --init-script).
// Asks every Android module for a SARIF report next to the HTML and XML ones,
// and keeps lint reporting instead of failing the task: CI publishes the
// findings (job summary, annotations, artifact) and does not gate on them.
// Only this CI run sees it; app/android is regenerated by prebuild each time.
gradle.beforeProject { project ->
    ['com.android.application', 'com.android.library'].each { id ->
        project.pluginManager.withPlugin(id) {
            def lint = project.extensions.getByName('android').lint
            lint.htmlReport = true
            lint.xmlReport = true
            lint.sarifReport = true
            lint.abortOnError = false
        }
    }
}
