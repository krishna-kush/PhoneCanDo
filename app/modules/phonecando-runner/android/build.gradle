plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.phonecando.runner'
version = '0.1.0'

expoModule {
  // The Expo plugin publishes a single "release" component; with product
  // flavors the components are <flavor>Release, so publishing is off (the
  // module is consumed from source only).
  canBePublished false
}

android {
  namespace "com.phonecando.runner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // Channels are product flavors (app/plugins/withBuildChannel.js declares the
  // same dimension on the app). Only this module and the app differ per
  // channel; every other library compiles once and is shared.
  flavorDimensions += ["channel"]
  productFlavors {
    full {
      dimension "channel"
      // Keeps the class AutomationHost.kt finds by reflection if the app
      // ever minifies; only full has it.
      consumerProguardFiles 'consumer-rules-full.pro'
    }
    lite { dimension "channel" }
    play { dimension "channel" }
  }
  sourceSets {
    // The a11y driver, PCE host and pack keys exist only in full.
    full {
      java.srcDirs += 'src/uiauto/java'
      kotlin.srcDirs += 'src/uiauto/java'
      res.srcDirs += 'src/uiauto/res'
    }
  }
  testOptions {
    unitTests.all {
      // The kinds' manifests, the runtime plugins and the phone tools'
      // table, which the JVM tests load as the APK would
      // (src/test/.../agents/TestKinds.kt, bridge/mcp/).
      def agentsDir = file('../../../../agents')
      inputs.files(fileTree(agentsDir) { include '*/*/agent.json', 'runtimes/**', 'shared/phone-tools/tools.json' })
      systemProperty 'phonecando.agentsDir', agentsDir.absolutePath
    }
  }
}

// The agent kinds' config assets and native libs, per channel, from their
// manifests (agents/{native,image}/<id>/agent.json). After `android {}`: it
// adds jniLibs to the flavors declared there.
apply from: 'agents.gradle'

dependencies {
  // Loopback agent bridge HTTP framing (MIT). Hand-rolling it was 100 lines of
  // parser nobody asked for.
  implementation 'org.nanohttpd:nanohttpd:2.3.1'

  // Agent kinds (pure JVM, every flavor): the kit (the AgentKind seam, the
  // manifest model and what renders it) and the bundled kinds' code hooks.
  // The app's settings plugin substitutes these coordinates with the
  // included `agents/` build.
  implementation 'com.phonecando.agents:agents-kit-api:0.1.0-dev'
  implementation 'com.phonecando.agents:agents-kit-manifest:0.1.0-dev'
  implementation 'com.phonecando.agents:agents-kit-render:0.1.0-dev'
  implementation 'com.phonecando.agents:agents-kit-term:0.1.0-dev'
  implementation 'com.phonecando.agents:agents-builtin:0.1.0-dev'

  // TUI engines run on PTYs of the terminal module's PtyHost
  // (com.phonecando.terminal.host), which outlive the JS that shows them.
  implementation project(':phonecando-terminal')

  // The model slot (models/): the models module's one store and device
  // reading (ModelsHost), and its jobs, which keep our service up. Of lme
  // (pure JVM, the included lme/ build) the runner uses the shared types,
  // the store's registry (read only) and the launch plan; never the catalog.
  implementation project(':phonecando-models')
  implementation 'com.phonecando.lme:lme-api:0.1.0-dev'
  implementation 'com.phonecando.lme:lme-store:0.1.0-dev'
  implementation 'com.phonecando.lme:lme-host:0.1.0-dev'

  // The Linux module's running jobs (LinuxHost's JobRegistry: env downloads,
  // machine setup, agent installs), which keep our service up like model
  // jobs (jobs/JobsAnchor.kt).
  implementation project(':phonecando-linux')

  // The app's settings plugin substitutes these coordinates with the included
  // `pce/` build; lite/play never resolve them.
  fullImplementation 'com.phonecando.pce:pce-api:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-core:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-json:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-android:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-pack:0.1.0-dev'

  // JVM tests of the pure telemetry redaction (src/test, PathRedactor.kt),
  // of what a consume keeps (TelemetryStore and TelemetryRecorder over an
  // in-memory store), of the bridge's auth, routes, screen lease and
  // prompts (src/test/.../bridge), of the kind catalog and of the TUI
  // engine's terminal (src/test/.../engine/tui):
  // ./gradlew :phonecando-runner:testLiteDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub on the JVM; the telemetry store parses
  // its file with it.
  testImplementation 'org.json:json:20250517'
}
