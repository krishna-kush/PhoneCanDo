plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.phonecando.runner'
version = '0.1.0'

expoModule {
  // The Expo plugin publishes a single "release" component; with product
  // flavors the components are <flavor>Release, so publishing is off (the
  // module is consumed from source only).
  canBePublished false
}

// Agent config, one entry per agent kind: the source under agents/<kind>/
// (module root, so an iOS implementation can consume the same files) and the
// assets folder the service seeds from (AgentKind.config.assetDir). Android
// packages a generated copy per variant; non-full channels drop the
// full-only files and take the overlay's instead. `shared` folders come from
// agents/shared/ (kind-neutral code, e.g. the phone tools) and land inside
// the kind's config, so its plugins import them by a relative path that
// stays within the seeded tree; their full-only parts are dropped the same
// way.
def phoneTools = [
  source: file("../agents/shared/phone-tools"),
  into: "phone-tools",
  fullOnly: ["control/**"],
]
def agentConfigs = [
  [
    assetDir: "oc-config",
    source: file("../agents/oc/config"),
    fullOnly: ["AGENTS.md", "plugins/automation/**"],
    overlay: file("../agents/oc/config-lite"),
    shared: [phoneTools],
  ],
]

android {
  namespace "com.phonecando.runner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // Channels are product flavors (app/plugins/withBuildChannel.js declares the
  // same dimension on the app). Only this module and the app differ per
  // channel; every other library compiles once and is shared.
  flavorDimensions += ["channel"]
  productFlavors {
    full {
      dimension "channel"
      // Keeps the class AutomationHost.kt finds by reflection if the app
      // ever minifies; only full has it.
      consumerProguardFiles 'consumer-rules-full.pro'
    }
    lite { dimension "channel" }
    play { dimension "channel" }
  }
  sourceSets {
    main {
      // Ship the agent engines (bionic executables named lib*.so) as native
      // libs (CNG-safe: module-owned dir). Executed from nativeLibraryDir,
      // the only place SELinux permits exec.
      jniLibs.srcDirs += ['src/main/libs']
    }
    // The a11y driver, PCE host and pack keys exist only in full.
    full {
      java.srcDirs += 'src/uiauto/java'
      kotlin.srcDirs += 'src/uiauto/java'
      res.srcDirs += 'src/uiauto/res'
    }
  }
  lintOptions {
    abortOnError false
  }
}

// Copies the agent configs one variant ships. The Android plugin owns the
// output folder (addGeneratedSourceDirectory below), so it knows this task
// produces those assets and runs it before every task that reads them: asset
// merging, lint, and any reader a later plugin version adds. Registering the
// folder as a plain asset srcDir instead hides the producer, and Gradle 9
// fails the build on each reader it was not linked to.
abstract class AgentConfigSync extends Sync {
  @OutputDirectory
  abstract DirectoryProperty getOutputDir()
}

androidComponents {
  onVariants(selector().all()) { variant ->
    def channel = variant.flavorName
    def sync = tasks.register("syncAgentConfig${variant.name.capitalize()}", AgentConfigSync) {
      into(outputDir)
      agentConfigs.each { cfg ->
        from(cfg.source) {
          into cfg.assetDir
          exclude "**/node_modules/**"
          if (channel != "full") exclude cfg.fullOnly
        }
        if (channel != "full") {
          from(cfg.overlay) {
            into cfg.assetDir
          }
        }
        cfg.shared.each { part ->
          from(part.source) {
            into "${cfg.assetDir}/${part.into}"
            exclude "**/node_modules/**"
            if (channel != "full") exclude part.fullOnly
          }
        }
      }
      doFirst {
        agentConfigs.each { cfg ->
          if (!cfg.source.isDirectory() || (channel != "full" && !cfg.overlay.isDirectory())) {
            throw new GradleException("Missing agent config ${cfg.assetDir} for channel ${channel}")
          }
          cfg.shared.each { part ->
            if (!part.source.isDirectory()) {
              throw new GradleException("Missing shared agent code ${part.source} for ${cfg.assetDir}")
            }
          }
        }
      }
    }
    variant.sources.assets?.addGeneratedSourceDirectory(sync) { it.outputDir }
  }
}

dependencies {
  // Loopback agent bridge HTTP framing (MIT). Hand-rolling it was 100 lines of
  // parser nobody asked for.
  implementation 'org.nanohttpd:nanohttpd:2.3.1'

  // The app's settings plugin substitutes these coordinates with the included
  // `pce/` build; lite/play never resolve them.
  fullImplementation 'com.phonecando.pce:pce-api:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-core:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-json:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-android:0.1.0-dev'
  fullImplementation 'com.phonecando.pce:pce-pack:0.1.0-dev'

  // JVM tests of the pure telemetry redaction (src/test, PathRedactor.kt),
  // of what a consume keeps (TelemetryStore and TelemetryRecorder over an
  // in-memory store) and of the bridge's auth, routes, screen lease and
  // prompts (src/test/.../bridge): ./gradlew :phonecando-runner:testLiteDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub on the JVM; the telemetry store parses
  // its file with it.
  testImplementation 'org.json:json:20250517'
}
