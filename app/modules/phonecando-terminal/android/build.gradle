plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.phonecando.terminal'
version = '0.1.0'

android {
  namespace "com.phonecando.terminal"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        cppFlags ""
      }
    }
    // Same architecture list as the app (reactNativeArchitectures); without
    // this the JNI PTY was compiled for all four ABIs on every build.
    ndk {
      abiFilters((project.findProperty("reactNativeArchitectures") ?: "arm64-v8a")
        .split(",").collect { it.trim() }.toArray(new String[0]))
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}
